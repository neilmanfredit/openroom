---
# Defaults shared by all rooms. Override per-device in host_vars/<hostname>.yml.
# Secrets (Graph client certificate/key) belong ONLY in host_vars, vaulted
# with ansible-vault — never here, never in plain text. See docs/M365-SETUP.md.

# Display name for the room; shown on the home screen.
room_name: "Meeting Room"

# The unprivileged local account that runs the kiosk session.
kiosk_user: kiosk
kiosk_group: kiosk
kiosk_home: /home/kiosk

# The page Chromium opens on start: the control service's home screen.
kiosk_start_url: "http://127.0.0.1:8080/"

# Extra Chromium command-line flags, appended after the fixed kiosk set
# in roles/kiosk/templates/openroom-kiosk.service.j2.
chromium_extra_flags: []

# --- AV (Milestone 2) ---
# Identify the room's speakerphone and camera by USB vendor/product ID
# (from `lsusb`, e.g. "046d") rather than relying on enumeration order,
# which changes across reboots and hot-plug events. These placeholders
# must be overridden per-room in host_vars/<hostname>.yml — see
# docs/HARDWARE.md.
av_speakerphone_vendor_id: "0000"
av_speakerphone_product_id: "0000"
av_camera_vendor_id: "0000"
av_camera_product_id: "0000"

# Only set true for a speakerphone/microphone with no hardware echo
# cancellation. Enabling this on top of a device that already does AEC
# in hardware causes double-cancellation artefacts.
av_software_echo_cancel_enabled: false

# Camera capture format locked by openroom-av.service.
av_camera_format:
  width: 1280
  height: 720
  pixelformat: MJPG

# Extra v4l2-ctl controls applied to the camera, as raw "control=value"
# strings (e.g. "focus_automatic_continuous=0"). Left empty by default —
# UVC control names vary by camera model; run
# `v4l2-ctl --device=/dev/openroom-camera --list-ctrls` on the real
# device and fill these in (see docs/HARDWARE.md).
av_camera_v4l2_controls: []

# --- Control service (Milestone 3) ---
# Teams' own "join with an ID and passcode" page — see docs/OPERATIONS.md
# for why this isn't a constructed deep link.
control_join_by_id_url: "https://teams.microsoft.com/meet"

control_external_base_url: "http://127.0.0.1:8080"
control_extension_version: "1.0.0"

# --- Calendar (Milestone 4) ---
# App registration IDs (not secret) — see docs/M365-SETUP.md. Calendar
# polling stays disabled until these, and the vaulted certificate/key in
# host_vars, are set per-room.
graph_tenant_id: ""
graph_client_id: ""

# The room resource mailbox's UPN/email, e.g. "room-brighton-1@example.onmicrosoft.com".
room_mailbox_upn: ""

# Show the real meeting subject, or just the organiser's name? Meetings
# marked "Private" in Outlook/Teams always show as "Private" either way.
show_meeting_subject: true

calendar_poll_interval_seconds: 60
calendar_timezone: "Europe/London"
