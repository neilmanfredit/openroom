<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>OpenRoom</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --fg: #f8fafc;
      --accent: #38bdf8;
    }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    h1 {
      font-size: 3rem;
      margin: 0;
      letter-spacing: 0.05em;
    }
    p {
      margin: 0;
      font-size: 1.25rem;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <h1>OpenRoom</h1>
  <p>Kiosk build in progress &mdash; the home screen arrives with the control service.</p>
</body>
</html>
